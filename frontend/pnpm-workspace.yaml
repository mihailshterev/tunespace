# Supply-chain guards.
# Only resolve versions published at least 7 days ago (minutes)
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600

# Security floors for vulnerable transitive versions (pnpm audit).
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  "nanoid@<3.3.18": "^3.3.18"
  "postcss@<8.5.23": "^8.5.23"
  "postcss-selector-parser@<6.1.5": "^6.1.5"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
